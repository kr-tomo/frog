<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>개구리 점프</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="두 사람이 한 화면에서 겨루는 개구리 징검다리 건너기 대결 게임">
<meta name="theme-color" content="#0d3b4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="개구리 점프">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; padding: 0; background: #061a24; }
  body {
    position: fixed; inset: 0; width: 100%; height: 100dvh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;   /* 캔버스는 항상 정중앙, 남는 곳은 레터박스 */
    box-sizing: border-box;                                          /* 홈 인디케이터·노치 영역은 피해서 배치 */
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; outline: none; }
  noscript { color: #fff; font: 18px sans-serif; }
</style>
</head>
<body>
<canvas id="game" aria-label="개구리 점프 게임 화면"></canvas>
<noscript>이 게임은 JavaScript가 필요합니다.</noscript>

<script>
(() => {
'use strict';

/* =====================================================================
 * 1. CONFIG — 수치·스탯·돌 설정 (여기만 고쳐서 밸런스를 조절하세요)
 * ===================================================================== */
const CONFIG = {
  W: 540, H: 960,                                    // 논리 해상도 (세로 고정, 아래→위 진행)
  island: { startH: 170, goalH: 110 },               // 출발 섬(하단, 모바일 하단 UI와 겹치지 않게 여유 포함) / 도착 섬(상단) 높이
  stone: {
    count: 7,
    rx0: 113.4, ry0: 39.69,                          // 첫 번째 돌의 타원 반지름 (옵션이 들어갈 자리를 위해 기존 126×44.1의 0.9배)
    ratio: 0.85,                                     // 등비수열 공비 (?ratio=0.8 로 덮어쓰기 가능)
    sideMargin: 16,                                  // 화면 가장자리와의 최소 간격
    maxCenterOffset: 132,                            // 강 중앙선에서 좌우로 벗어날 수 있는 최대 거리 (배치 편차, 기존 120의 1.1배)
    reachLimit: 0.7,                                 // 연속한 두 돌 사이 거리 ≤ (가장 약한 개구리 최대 점프) × 0.7
    landingSlack: 1.0,                               // 착지 타원 배율 (1.0 = 그림과 상관없는 정확한 타원)
    visualScale: 1.05                                // 돌 그림만 살짝 크게 (판정 무관, 돌끼리 그림이 겹치지 않는 선)
  },
  jump: {
    minDist: 40, maxDist: 225,                       // 논리 px (최대 거리는 기존 300의 75%)
    maxCharge: 1.25,                                 // 게이지가 가득 차는 시간(초) — 차오르는 속도 0.8배 (1.0초 → 1.25초)
    ease: (t) => t * t * (3 - 2 * t),                // 누른 시간 → 거리 비율 곡선
    durMin: 0.40, durMax: 0.60,                      // 점프 체공 시간
    heightMin: 26, heightMax: 70,                    // 포물선 높이(시각 효과)
    errorDist: 'normal',                             // 'normal' | 'uniform'
    errorClampSigma: 2.5                             // 정규분포 꼬리 제한(σ 단위)
  },
  frog: {
    radius: 28.8,                                    // 그림 크기 기준 (기존 24의 120%, 판정 무관)
    touchRadius: 70,                                 // 터치 영역 (기존 58의 120%, 그림보다 넉넉하게)
    deadzone: 6,                                     // 중심과 너무 가까운 터치는 방향 무시
    startXs: [0.30, 0.70],                           // P1/P2 출발 위치 (가로 비율)
    startYRatio: 0.3,                                // 출발 섬 안에서의 세로 위치 (작을수록 위쪽 → 화면 아래쪽에 여유)
    landTime: 0.18, splashTime: 0.95, spawnTime: 0.35
  },
  game: { countdownStep: 0.8, goShow: 0.7, resultPanelDelay: 0.9 },
  players: [
    { label: 'P1', color: '#3da5ff' },
    { label: 'P2', color: '#ff5c5c' }
  ],
  /* 게임 옵션 3종 — 시작 전에 설정 화면에서 켜고 끕니다.
   * 켜진 옵션은 맵 "위쪽 절반"의 돌 줄 중 서로 다른 줄에 하나씩만 배치됩니다(한 줄에 둘 이상 겹치지 않음).
   * 길이 단위는 "개구리 크기"(= 개구리 지름, frog.radius × 2) 배수입니다. */
  options: {
    edgeMargin: 6,                                   // 옵션 요소가 화면 가장자리와 두는 최소 간격(px)
    shark: {
      rx: 0.52, ry: 0.30,                            // 상어 판정 타원 반지름 (개구리 크기만 한 상어)
      clearance: 0.2,                                // 돌과 항상 두는 최소 거리 (이동 동선 전체 기준)
      swing: 0.5,                                    // 좌우로 움직이는 거리(한쪽 진폭)
      period: [2.6, 3.4],                            // 한 번 왕복하는 시간(초) 범위
      jitterY: 8,                                    // 줄 높이에서 위아래로 흩어지는 정도(px)
      biteTime: 0.7                                  // 잡아먹은 뒤 결과 화면까지 걸리는 시간(초)
    },
    slippery: {
      gap: 0.6,                                      // 쌍둥이 돌 사이 간격
      slideExtra: 0.35,                              // 미끄러져 돌 가장자리를 벗어나 더 나가는 거리
      slideTime: [0.35, 0.8]                         // 미끄러지는 시간(초) 범위
    },
    shallow: {
      rx: 0.55, ry: 0.38,                            // 얕은 물 판정 타원 반지름 (개구리 한 마리 크기의 돌)
      gap: [0.3, 1.0],                               // 옆 돌 가장자리와의 간격 범위
      jitterY: 12,
      revealTime: 0.6                                // 첫 접촉 뒤 그림자가 나타나는 시간(초)
    }
  },
  /* 테마(계절) — 새 테마는 아래에 한 항목을 추가하고 assets/themes/<id>/ 폴더에 이미지를 넣으면 됩니다.
   * pal: 이미지가 없을 때 쓰는 임시 그래픽 색 · particles: 계절 입자(꽃잎·반짝임·낙엽·눈) 동작 */
  defaultTheme: 'spring',
  themes: [
    { id: 'spring', name: '봄',
      pal: { waterA: '#5ec8d8', waterB: '#2a8fb0', landA: '#b2cf84', landB: '#86ab5e', stoneA: '#e4dfd4', stoneB: '#a7a292', stoneEdge: '#7d786b', slick: '#9fd8ff', ripple: '255,255,255', pc: ['#ffc0d6', '#ffffff', '#ff9fc0', '#ffe3ee'] },
      particles: { mode: 'fall', count: 14, vy: [22, 44], vx: [-12, 12], sway: 14, spin: 1.6, size: [13, 20], alpha: 0.9 } },
    { id: 'summer', name: '여름',
      pal: { waterA: '#2fc0e8', waterB: '#0b6aa8', landA: '#b3cf72', landB: '#86ac4c', stoneA: '#ebe0c8', stoneB: '#aa9f80', stoneEdge: '#827750', slick: '#a8e4ff', ripple: '255,255,255', pc: ['#ffffff', '#fff6a8', '#bff3ff', '#ffffff'] },
      particles: { mode: 'twinkle', count: 22, size: [10, 18], speed: [1.2, 2.4], alpha: 0.95 } },
    { id: 'autumn', name: '가을',
      pal: { waterA: '#4fa3a0', waterB: '#256a78', landA: '#d6a64a', landB: '#b27a30', stoneA: '#c9bfae', stoneB: '#857b6c', stoneEdge: '#5f574b', slick: '#8fd0e0', ripple: '255,240,210', pc: ['#e8552a', '#f0a030', '#e8c53a', '#a8612a'] },
      particles: { mode: 'fall', count: 12, vy: [26, 50], vx: [-16, 16], sway: 22, spin: 2.2, size: [16, 24], alpha: 0.92 } },
    { id: 'winter', name: '겨울',
      pal: { waterA: '#b7e0f4', waterB: '#6fb0d6', landA: '#eef6fb', landB: '#cfe3ee', stoneA: '#f2f7fb', stoneB: '#b4c7d4', stoneEdge: '#8aa2b3', slick: '#d6f0ff', ripple: '255,255,255', pc: ['#ffffff', '#e6f4ff', '#d4ecff', '#ffffff'] },
      particles: { mode: 'fall', count: 34, vy: [18, 38], vx: [-8, 8], sway: 10, spin: 1.0, size: [9, 16], alpha: 0.95 } }
  ],
  /* 개구리 5종 — 새 종류를 추가하려면 한 줄만 더하면 됩니다.
   * (스프라이트는 assets/frogs/<id>/<상태>.png 로 자동 연결됩니다) */
  frogs: [
    { id: 'balanced', name: '개굴이', concept: '균형형', desc: '뭐든 무난한 올라운더',      power: 1.00, sigma: 5,   color: '#6cc24a', dark: '#2f7d32' },
    { id: 'power',    name: '우람이', concept: '파워형', desc: '멀리 뛰지만 방향이 흔들려요', power: 1.15, sigma: 8,   color: '#ff9440', dark: '#a8520f' },
    { id: 'precise',  name: '또박이', concept: '정밀형', desc: '짧게 뛰지만 아주 정확해요',   power: 0.90, sigma: 2,   color: '#a98af0', dark: '#5a3ea8' },
    { id: 'leaper',   name: '깡총이', concept: '도약형', desc: '조금 더 멀리, 조금 흔들려요', power: 1.05, sigma: 6.5, color: '#f2d544', dark: '#9a7d0b' },
    { id: 'steady',   name: '든든이', concept: '안정형', desc: '살짝 짧지만 믿음직해요',      power: 0.95, sigma: 3.5, color: '#f28aa4', dark: '#a8385a' }
  ]
};

const FROG_STATES = ['idle', 'charge', 'jump', 'land', 'splash', 'slip', 'win', 'lose'];   // slip: 미끄러운 돌 위에서 미끄러지는 중
const TAU = Math.PI * 2;
const W = CONFIG.W, H = CONFIG.H;

/* URL 파라미터: ?seed=123 (돌 배치 고정) · ?ratio=0.8 · ?debug=1 · ?noassets=1 */
const PARAMS = new URLSearchParams(location.search);
const FIXED_SEED = PARAMS.has('seed') && Number.isFinite(parseInt(PARAMS.get('seed'), 10)) ? (parseInt(PARAMS.get('seed'), 10) >>> 0) : null;
const DEBUG = PARAMS.has('debug');
if (PARAMS.has('ratio')) {
  const r = parseFloat(PARAMS.get('ratio'));
  if (r >= 0.5 && r <= 1.0) CONFIG.stone.ratio = r;
}

/* =====================================================================
 * 2. ASSETS — 스프라이트 매니페스트 (이미지 파일만 교체하면 외형이 바뀝니다)
 *   src     : assets/ 기준 상대 경로
 *   frames  : 가로로 이어 붙인 프레임 수 (스프라이트 시트, 기본 1)
 *   fps/loop: 프레임 애니메이션 속도 / 반복 여부
 *   anchor  : 그림 기준점 (0~1). 기본 [0.5, 0.5]
 *   size    : 화면에 그릴 논리 크기 [w, h] (생략하면 이미지 원본 크기)
 *   rotate  : true면 개구리가 보는 방향으로 회전 (그림은 "위쪽을 보는" 모양으로 그리기)
 *   ※ 판정(돌 타원, 터치 반경 등)은 CONFIG가 정하며 이미지 크기와 무관합니다.
 *   ※ 파일이 없거나 로드에 실패하면 Canvas로 그린 임시 그래픽으로 자동 대체됩니다.
 * ===================================================================== */
const ASSET_DIR = 'assets/';
const FS = CONFIG.frog.radius / 24;                   // 개구리 관련 그림 크기 배율 (기준 반지름 24 대비)
const ASSETS = {
  // 상어(옵션) — 오른쪽을 보는 4프레임 시트. 왼쪽으로 헤엄칠 땐 코드가 뒤집어 그립니다
  shark:        { src: 'shark.png', frames: 4, fps: 8, loop: true, size: [76, 38] },
  // 이펙트
  fx_shadow:    { src: 'fx/shadow.png',  size: [48 * FS, 24 * FS] },
  fx_splash:    { src: 'fx/splash.png',  frames: 8, fps: 10, loop: false, size: [140, 110] },
  fx_ripple:    { src: 'fx/ripple.png',  frames: 6, fps: 6,  loop: false, size: [150, 90] },
  fx_dust:      { src: 'fx/dust.png',    frames: 5, fps: 14, loop: false, size: [80, 50] },
  fx_confetti:  { src: 'fx/confetti.png', frames: 4 },       // 프레임마다 다른 색 조각
  // UI — 게이지·화살표·링·배지
  ui_gauge_bg:   { src: 'ui/gauge_bg.png',   size: [64, 12] },
  ui_gauge_fill: { src: 'ui/gauge_fill.png', size: [64, 12] },
  ui_arrow:      { src: 'ui/arrow.png',      anchor: [0.5, 1], size: [26, 60] },   // 위쪽을 향한 화살표, 길이는 코드가 조절
  ui_ring_p1:    { src: 'ui/ring_p1.png',    size: [72 * FS, 44 * FS] },
  ui_ring_p2:    { src: 'ui/ring_p2.png',    size: [72 * FS, 44 * FS] },
  ui_badge_p1:   { src: 'ui/badge_p1.png',   size: [44, 24] },
  ui_badge_p2:   { src: 'ui/badge_p2.png',   size: [44, 24] },
  // UI — 화면·버튼·아이콘
  ui_title:      { src: 'ui/title.png' },
  ui_panel:      { src: 'ui/panel.png' },
  ui_card:       { src: 'ui/card.png',        size: [88, 130] },
  ui_card_sel:   { src: 'ui/card_selected.png', size: [96, 138] },
  ui_btn:        { src: 'ui/btn.png' },
  ui_btn_sub:    { src: 'ui/btn_sub.png' },
  ui_btn_icon:   { src: 'ui/btn_icon.png',    size: [56, 56] },
  icon_pause:    { src: 'ui/icon_pause.png',  size: [28, 28] },
  icon_sound_on: { src: 'ui/icon_sound_on.png',  size: [30, 30] },
  icon_sound_off:{ src: 'ui/icon_sound_off.png', size: [30, 30] },
  ui_count_3:    { src: 'ui/count_3.png' },
  ui_count_2:    { src: 'ui/count_2.png' },
  ui_count_1:    { src: 'ui/count_1.png' },
  ui_go:         { src: 'ui/go.png' },
  // UI — 설정 화면 (토글 스위치, 옵션 아이콘)
  ui_toggle_on:  { src: 'ui/toggle_on.png',  size: [78, 40] },
  ui_toggle_off: { src: 'ui/toggle_off.png', size: [78, 40] },
  icon_opt_shark:    { src: 'ui/icon_opt_shark.png',    size: [44, 44] },
  icon_opt_slippery: { src: 'ui/icon_opt_slippery.png', size: [44, 44] },
  icon_opt_shallow:  { src: 'ui/icon_opt_shallow.png',  size: [44, 44] }
};
/* 테마별 스프라이트 — 실제 경로는 assets/themes/<테마 id>/<src> 입니다.
 * 테마 폴더에 파일이 없으면 기본 테마(defaultTheme) 폴더의 같은 파일로 대신하고, 그것도 없으면 임시 그래픽을 씁니다.
 * (새 테마는 이 파일들을 새 폴더에 넣기만 하면 됩니다. 일부만 넣어도 동작합니다.) */
const THEME_DIR = 'themes/';
const THEME_ASSETS = {
  bg_water:       { src: 'water.webp',        anchor: [0, 0], size: [W, H] },                       // 강 배경 (1080×1920 권장)
  island_start:   { src: 'island_start.webp', anchor: [0, 0], size: [W, CONFIG.island.startH] },   // 아래 섬, 위쪽이 해안선 (1080×340)
  island_goal:    { src: 'island_goal.webp',  anchor: [0, 0], size: [W, CONFIG.island.goalH] },    // 위 섬, 아래쪽이 해안선 + 결승선 (1080×220)
  stone:          { src: 'stone.png' },                                                            // 타원 돌 (600×200), 판정 크기에 맞춰 늘려 그림
  stone_slippery: { src: 'stone_slippery.png' },                                                   // 미끄러운 돌 (600×200)
  fx_shallow:     { src: 'shallow.png' },                                                          // 얕은 물 첫 접촉 뒤에 보이는 희미한 그림자 (240×160)
  fx_season:      { src: 'particles.png', frames: 4 },                                             // 계절 입자 4종 시트 (256×64)
  ui_theme_icon:  { src: 'icon.png', size: [48, 48] }                                              // 설정 화면의 계절 아이콘 (96×96)
};
// 개구리 스프라이트 키: frog_<id>_<상태>  (상태: idle charge jump land splash win lose)
// 단일 이미지(idle)만 있어도 동작합니다 — 없는 상태는 idle 이미지로 대체됩니다.
for (const f of CONFIG.frogs) {
  for (const st of FROG_STATES) {
    ASSETS[`frog_${f.id}_${st}`] = {
      src: `frogs/${f.id}/${st}.png`, size: [64 * FS, 64 * FS], rotate: true,
      frames: 1, fps: 10, loop: !(st === 'jump' || st === 'land' || st === 'splash')
    };
  }
}

const Sprites = {
  images: {},                                          // 공통: 키 그대로 · 테마용: '<테마id>/<키>'
  loadChain(storeKey, urls) {                          // urls를 차례로 시도, 모두 실패하면 임시 그래픽 사용
    let i = 0;
    const img = new Image();
    img.onload = () => { Sprites.images[storeKey] = img; };
    img.onerror = () => { if (++i < urls.length) img.src = urls[i]; };
    img.src = urls[0];
  },
  load() {
    if (PARAMS.has('noassets')) return;
    for (const key of Object.keys(ASSETS)) this.loadChain(key, [ASSET_DIR + ASSETS[key].src]);
    const def = CONFIG.defaultTheme;
    for (const t of CONFIG.themes) {
      for (const key of Object.keys(THEME_ASSETS)) {
        const src = THEME_ASSETS[key].src, urls = [ASSET_DIR + THEME_DIR + t.id + '/' + src];
        if (t.id !== def) urls.push(ASSET_DIR + THEME_DIR + def + '/' + src);
        this.loadChain(t.id + '/' + key, urls);
      }
    }
  }
};

/* =====================================================================
 * 3. 전역 상태 & 캔버스
 * ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { scale: 1 };

const G = {
  state: 'title',            // title | select | options | countdown | playing | paused | result
  stateT: 0, time: 0, elapsed: 0, goT: 99,
  seed: 0, stones: [], frogs: [], fx: [], confetti: [],

  sharkLoss: null, loseInfo: null,           // 상어에게 잡아먹힌 개구리 / 결과 화면용 패배 사유
  particles: [],                             // 계절 입자
  options: { shark: false, slippery: false, shallow: false },   // 시작 전에 켜고 끄는 옵션
  theme: CONFIG.defaultTheme,
  selection: [0, 0],         // P1/P2가 고른 개구리 종류(인덱스)
  winner: null, lastCount: 4,
  updateReady: false, installReady: false
};
let jumpRng = Math.random;
const OPTION_KEYS = ['shark', 'slippery', 'shallow'];
const theme = (id) => CONFIG.themes.find((t) => t.id === (id || G.theme)) || CONFIG.themes[0];
const frogSize = () => CONFIG.frog.radius * 2;          // 옵션 길이 단위: 개구리 크기

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - (1 - t) * (1 - t);

/* 시드 가능한 난수 (mulberry32) */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 저장된 설정 */
function loadPrefs() {
  try {
    const sel = JSON.parse(localStorage.getItem('frogjump.sel') || 'null');
    if (Array.isArray(sel) && sel.length === 2 && sel.every((n) => Number.isInteger(n) && n >= 0 && n < CONFIG.frogs.length)) G.selection = sel;
    Sfx.muted = localStorage.getItem('frogjump.muted') === '1';
    const op = JSON.parse(localStorage.getItem('frogjump.opts') || 'null');
    if (op && typeof op === 'object') for (const k of OPTION_KEYS) G.options[k] = op[k] === true;
    const th = localStorage.getItem('frogjump.theme');
    if (th && CONFIG.themes.some((t) => t.id === th)) G.theme = th;
  } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  // 디버그/공유용 URL 파라미터: ?theme=winter  ?opts=shark,slippery,shallow (또는 ?opts=none)
  if (PARAMS.has('theme') && CONFIG.themes.some((t) => t.id === PARAMS.get('theme'))) G.theme = PARAMS.get('theme');
  if (PARAMS.has('opts')) { const on = PARAMS.get('opts').split(','); for (const k of OPTION_KEYS) G.options[k] = on.includes(k); }
}
function savePrefs() {
  try {
    localStorage.setItem('frogjump.sel', JSON.stringify(G.selection));
    localStorage.setItem('frogjump.muted', Sfx.muted ? '1' : '0');
    localStorage.setItem('frogjump.opts', JSON.stringify(G.options));
    localStorage.setItem('frogjump.theme', G.theme);
  } catch (e) { /* 무시 */ }
}

/* =====================================================================
 * 4. 효과음 (WebAudio, 선택 사항) — 음소거 버튼 제공
 * ===================================================================== */
const Sfx = {
  ctx: null, muted: false,
  unlock() {
    if (!this.ctx) {
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { /* 무시 */ }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(f0, f1, dur, type = 'sine', vol = 0.16, delay = 0) {
    if (this.muted || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol = 0.2, freq = 1400) {
    if (this.muted || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const n = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  },
  click()  { this.tone(660, 880, 0.06, 'square', 0.07); },
  tick()   { this.tone(740, 740, 0.09, 'triangle', 0.14); },
  go()     { this.tone(988, 1568, 0.25, 'triangle', 0.18); },
  jump()   { this.tone(320, 640, 0.14, 'sine', 0.16); },
  land()   { this.tone(200, 90, 0.12, 'triangle', 0.2); },
  splash() { this.noise(0.4, 0.22, 1600); this.tone(500, 160, 0.25, 'sine', 0.08); },
  win()    { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, f, 0.22, 'triangle', 0.16, i * 0.11)); },
  slip()   { this.tone(900, 260, 0.35, 'sine', 0.12); this.noise(0.18, 0.08, 3200); },
  bite()   { this.noise(0.35, 0.3, 900); this.tone(180, 60, 0.4, 'sawtooth', 0.14); this.tone(120, 50, 0.3, 'square', 0.08, 0.12); },
  reveal() { this.tone(520, 780, 0.2, 'sine', 0.1); this.tone(780, 1040, 0.2, 'sine', 0.07, 0.1); }
};

/* =====================================================================
 * 5. 유틸: 스프라이트 그리기 / 텍스트 / 도형
 * ===================================================================== */
/* 스프라이트 찾기: 테마용 키는 '<테마id>/<키>' 이미지를, 공통 키는 그대로 찾는다 (o.theme으로 다른 테마 지정 가능) */
function resolveSprite(key, tid) {
  if (THEME_ASSETS[key]) return { img: Sprites.images[(tid || G.theme) + '/' + key], def: THEME_ASSETS[key] };
  return { img: Sprites.images[key], def: ASSETS[key] };
}
function drawSprite(key, x, y, o = {}) {
  const { img, def } = resolveSprite(key, o.theme);
  if (!img) return false;
  const frames = def.frames || 1;
  const fw = img.naturalWidth / frames, fh = img.naturalHeight;
  let fi = 0;
  if (o.frame !== undefined) fi = o.frame % frames;
  else if (frames > 1) {
    const t = o.t !== undefined ? o.t : G.time, step = Math.floor(t * (def.fps || 10));
    fi = def.loop === false ? Math.min(frames - 1, step) : step % frames;
  }
  const dw = o.w !== undefined ? o.w : (def.size ? def.size[0] : fw);
  const dh = o.h !== undefined ? o.h : (def.size ? def.size[1] : fh);
  const ax = def.anchor ? def.anchor[0] : 0.5, ay = def.anchor ? def.anchor[1] : 0.5;
  const crop = o.crop !== undefined ? o.crop : 1;
  ctx.save();
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.sx !== undefined || o.sy !== undefined) ctx.scale(o.sx !== undefined ? o.sx : 1, o.sy !== undefined ? o.sy : 1);
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.drawImage(img, fi * fw, 0, fw * crop, fh, -dw * ax, -dh * ay, dw * crop, dh);
  ctx.restore();
  return true;
}

const FONT = '"Jua","Do Hyeon","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
function text(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || '800'} ${o.size || 24}px ${FONT}`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  ctx.lineJoin = 'round';
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.stroke !== false) {
    ctx.lineWidth = o.strokeW || Math.max(3, (o.size || 24) / 6);
    ctx.strokeStyle = o.stroke || 'rgba(0,30,45,0.85)';
    if (o.maxW) ctx.strokeText(str, x, y, o.maxW); else ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = o.color || '#fff';
  if (o.maxW) ctx.fillText(str, x, y, o.maxW); else ctx.fillText(str, x, y);
  ctx.restore();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); }

/* =====================================================================
 * 6. 월드: 돌 배치 생성 · 착지 판정 (이미지와 완전히 분리)
 * ===================================================================== */
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

/* 옵션 요소가 돌 옆에 들어가려면 필요한 "돌 가장자리 ~ 화면 가장자리" 최소 폭 */
function sideRoomNeeded(kind, rx) {
  const O = CONFIG.options, FZ = frogSize(), em = O.edgeMargin;
  if (kind === 'shark') return O.shark.clearance * FZ + 2 * (O.shark.swing * FZ + O.shark.rx * FZ) + em;   // 돌과의 거리 + 상어 동선 전체 폭
  if (kind === 'slippery') return O.slippery.gap * FZ + 2 * rx + CONFIG.stone.sideMargin;                  // 쌍둥이 돌 한 개가 더 들어갈 폭
  return O.shallow.gap[0] * FZ + 2 * O.shallow.rx * FZ + em;                                               // 얕은 물 영역 폭
}

/* 한 번 배치해 본다. 조건을 만족하지 못하면 null (generateWorld가 다시 시도) */
function buildWorld(rng, opt, lenient) {
  const S = CONFIG.stone, O = CONFIG.options, FZ = frogSize(), n = S.count, em = O.edgeMargin;
  const top = CONFIG.island.goalH, bottom = H - CONFIG.island.startH, river = bottom - top;
  const ks = Array.from({ length: n }, (_, i) => Math.pow(S.ratio, i));      // 등비수열로 작아짐
  const rys = ks.map((k) => S.ry0 * k);
  // 돌끼리(그리고 섬과) 세로로 겹치지 않기 위한 최소 길이를 먼저 계산하고,
  // 남는 길이는 모든 구간에 똑같이 나눠 여백을 균등하게 만든다.
  let need = rys[0] + rys[n - 1];
  for (let i = 1; i < n; i++) need += rys[i - 1] + rys[i];
  const shrink = river < need ? river / need : 1;                              // 설정이 극단적이면 비례 축소
  const pad = Math.max(0, (river - need) / (n + 1));
  if (DEBUG && river < need) console.warn('강 길이가 부족합니다. 돌이 겹칠 수 있어요.');
  const ys = [];
  { let c = bottom; for (let i = 0; i < n; i++) { c -= (i === 0 ? rys[0] : rys[i - 1] + rys[i]) * shrink + pad; ys.push(c); } }

  // 옵션 배치 줄: "맵 위쪽 절반"에 있는 돌 줄 중 서로 다른 줄에 하나씩
  const mid = (top + bottom) / 2;
  const upper = shuffle(ys.map((y, i) => i).filter((i) => ys[i] < mid), rng);
  const kinds = shuffle(OPTION_KEYS.filter((k) => opt[k]), rng);
  if (kinds.length > upper.length) return null;
  const rowOpt = Array(n).fill(null);
  kinds.forEach((k, i) => { rowOpt[upper[i]] = k; });

  const weakest = Math.min(...CONFIG.frogs.map((f) => f.power));
  const reach = CONFIG.jump.maxDist * weakest * S.reachLimit;                  // 가장 약한 개구리도 건널 수 있는 상한
  const cx = W / 2, stones = [];
  let prev = null, shark = null, shallow = null;
  for (let i = 0; i < n; i++) {
    const rx = S.rx0 * ks[i], ry = rys[i], y = ys[i], kind = rowOpt[i];
    const minX = S.sideMargin + rx, maxX = W - S.sideMargin - rx;
    let lo = Math.max(minX, cx - S.maxCenterOffset), hi = Math.min(maxX, cx + S.maxCenterOffset);
    if (prev) {                                                                // 앞 돌에서 건널 수 있는 범위
      const dy = prev.y - y, dx = Math.sqrt(Math.max(0, reach * reach - dy * dy));
      lo = Math.max(lo, prev.x - dx); hi = Math.min(hi, prev.x + dx);
    }
    let x, side = 0;                                                           // side: 옵션 요소가 있는 쪽 (-1 왼쪽 / +1 오른쪽)
    if (kind) {
      const room = sideRoomNeeded(kind, rx), cands = [];
      const L = [Math.max(lo, room + rx), hi], R = [lo, Math.min(hi, W - room - rx)];
      if (L[0] <= L[1]) cands.push([-1, L]);
      if (R[0] <= R[1]) cands.push([1, R]);
      if (!cands.length) return null;
      const pick = cands[Math.floor(rng() * cands.length)];
      side = pick[0]; x = pick[1][0] + rng() * (pick[1][1] - pick[1][0]);
    } else {
      if (lo > hi) { if (!lenient) return null; lo = hi = (lo + hi) / 2; }
      x = lo + rng() * (hi - lo);
    }
    const base = { x, y, rx, ry, row: i, bob: 0, slippery: false };
    const safe = Object.assign({ idx: stones.length }, base);                  // 이 줄의 "정상" 돌 (다음 돌과의 연결 기준)
    stones.push(safe);

    if (kind === 'slippery') {                                                 // 쌍둥이 돌: 옆에 하나 더, 그쪽이 미끄럽다
      const gap = O.slippery.gap * FZ;
      stones.push(Object.assign({}, base, { idx: stones.length, x: x + side * (2 * rx + gap), slippery: true }));
    } else if (kind === 'shark') {
      const srx = O.shark.rx * FZ, sry = O.shark.ry * FZ, swing = O.shark.swing * FZ, clr = O.shark.clearance * FZ, half = swing + srx;
      const c0 = side > 0 ? x + rx + clr + half : em + half;                   // 동선 전체(진폭+몸 길이)가 돌에서 clr 이상 떨어지도록
      const c1 = side > 0 ? W - em - half : x - rx - clr - half;
      if (c0 > c1) return null;
      const scx = c0 + rng() * (c1 - c0), sy = y + (rng() * 2 - 1) * O.shark.jitterY;
      shark = { row: i, cx: scx, y: sy, swing, rx: srx, ry: sry, half, period: lerp(O.shark.period[0], O.shark.period[1], rng()),
                phase: rng() * TAU, t: 0, px: scx, py: sy, dir: 1, bite: null };
    } else if (kind === 'shallow') {
      const rxS = O.shallow.rx * FZ, ryS = O.shallow.ry * FZ, g0 = O.shallow.gap[0] * FZ, g1 = O.shallow.gap[1] * FZ;
      const avail = side > 0 ? (W - em) - (x + rx) : (x - rx) - em;
      const gmax = Math.min(g1, avail - 2 * rxS);
      if (gmax < g0 - 1e-9) return null;
      const g = g0 + rng() * Math.max(0, gmax - g0);
      shallow = { row: i, x: x + side * (rx + g + rxS), y: y + (rng() * 2 - 1) * O.shallow.jitterY, rx: rxS, ry: ryS, revealed: false, revealT: 0 };
    }
    prev = safe;
  }
  return { stones, shark, shallow, rowOpt, ys };
}

function generateWorld(rng, opt) {
  for (let a = 0; a < 80; a++) {
    const w = buildWorld(rng, opt, false);
    if (w) { w.attempts = a + 1; return w; }
  }
  const w = buildWorld(rng, { shark: false, slippery: false, shallow: false }, true);   // 최후의 수단: 옵션 없이
  w.fallback = true;
  return w;
}

/* 배치 검증 (개발·테스트용): 문제가 있으면 항목 이름 배열을 돌려준다 */
function validateWorld(w, opt) {
  const S = CONFIG.stone, O = CONFIG.options, FZ = frogSize(), em = O.edgeMargin, bad = [];
  const top = CONFIG.island.goalH, bottom = H - CONFIG.island.startH, mid = (top + bottom) / 2;
  const pts = (e, k = 160) => Array.from({ length: k }, (_, i) => [e.x + e.rx * Math.cos(TAU * i / k), e.y + e.ry * Math.sin(TAU * i / k)]);
  const minD = (A, B) => { let m = 1e9; for (const p of A) for (const q of B) m = Math.min(m, Math.hypot(p[0] - q[0], p[1] - q[1])); return m; };
  const inside = (p, e) => ((p.x - e.x) / e.rx) ** 2 + ((p.y - e.y) / e.ry) ** 2 < 1;
  const rectD = (px, py, r) => Math.hypot(Math.max(r.x0 - px, 0, px - r.x1), Math.max(r.y0 - py, 0, py - r.y1));
  const st = w.stones;
  for (const s of st) {
    if (s.x - s.rx < S.sideMargin - 1e-6 || s.x + s.rx > W - S.sideMargin + 1e-6) bad.push('stone-edge');
    if (s.y - s.ry < top - 1e-6 || s.y + s.ry > bottom + 1e-6) bad.push('stone-river');
  }
  for (let i = 0; i < st.length; i++) for (let j = i + 1; j < st.length; j++) {
    if (inside(st[i], st[j]) || inside(st[j], st[i]) || minD(pts(st[i], 90), pts(st[j], 90)) < 2) bad.push('stone-overlap');
  }
  const weakest = Math.min(...CONFIG.frogs.map((f) => f.power)), reach = CONFIG.jump.maxDist * weakest * S.reachLimit;
  const chain = st.filter((s) => !s.slippery);
  if (chain.length !== S.count) bad.push('chain-count');
  chain.forEach((s, k) => {
    if (s.row !== k) bad.push('chain-row');
    if (Math.abs(s.rx / (S.rx0 * Math.pow(S.ratio, k)) - 1) > 1e-9) bad.push('ratio');
    if (k > 0 && Math.hypot(s.x - chain[k - 1].x, s.y - chain[k - 1].y) > reach + 1e-6) bad.push('reach');
  });
  // 옵션 줄 규칙
  const enabled = OPTION_KEYS.filter((k) => opt[k]);
  if (w.rowOpt.filter(Boolean).length !== enabled.length) bad.push('option-count');
  const rowOf = { shark: w.shark && w.shark.row, shallow: w.shallow && w.shallow.row, slippery: (st.find((s) => s.slippery) || {}).row };
  for (const k of OPTION_KEYS) {
    if (!opt[k]) { if (rowOf[k] !== undefined && rowOf[k] !== null && rowOf[k] !== false) bad.push('unexpected-' + k); continue; }
    if (rowOf[k] === undefined || rowOf[k] === null) { bad.push('missing-' + k); continue; }
    if (w.rowOpt[rowOf[k]] !== k) bad.push('row-mismatch-' + k);
    if (!(w.ys[rowOf[k]] < mid)) bad.push('not-upper-' + k);
  }
  if (opt.slippery) {
    const sl = st.filter((s) => s.slippery);
    if (sl.length !== 1 || st.filter((s) => s.row === sl[0].row).length !== 2) bad.push('slippery-pair');
  }
  if (w.shark) {
    const s = w.shark, r = { x0: s.cx - s.half, x1: s.cx + s.half, y0: s.y - s.ry, y1: s.y + s.ry }, clr = O.shark.clearance * FZ;
    if (r.x0 < em - 1e-6 || r.x1 > W - em + 1e-6 || r.y0 < top || r.y1 > bottom) bad.push('shark-bounds');
    for (const t of st) for (const p of pts(t, 240)) if (rectD(p[0], p[1], r) < clr - 0.5) { bad.push('shark-clearance'); break; }
    if (Math.abs(s.rx * 2 - FZ) > FZ * 0.2) bad.push('shark-size');
  }
  if (w.shallow) {
    const s = w.shallow, sp = pts(s);
    if (s.x - s.rx < em - 1e-6 || s.x + s.rx > W - em + 1e-6 || s.y - s.ry < top || s.y + s.ry > bottom) bad.push('shallow-bounds');
    for (const t of st) if (inside(s, t) || inside(t, s) || minD(sp, pts(t)) < 0.2 * FZ - 0.5) { bad.push('shallow-near-stone'); break; }
    if (w.shark) { const r = { x0: w.shark.cx - w.shark.half, x1: w.shark.cx + w.shark.half, y0: w.shark.y - w.shark.ry, y1: w.shark.y + w.shark.ry }; for (const p of sp) if (rectD(p[0], p[1], r) < 1) { bad.push('shallow-near-shark'); break; } }
  }
  return bad;
}

function judgeLanding(x, y) {
  const slack = CONFIG.stone.landingSlack;
  for (const s of G.stones) {
    const dx = (x - s.x) / (s.rx * slack), dy = (y - s.y) / (s.ry * slack);
    if (dx * dx + dy * dy <= 1) return { type: s.slippery ? 'slippery' : 'stone', stone: s.idx };
  }
  const sh = G.shallow;                                      // 얕은 물: 눈에는 안 보이지만 개구리 크기의 돌로 판정
  if (sh) { const dx = (x - sh.x) / sh.rx, dy = (y - sh.y) / sh.ry; if (dx * dx + dy * dy <= 1) return { type: 'shallow' }; }
  if (y <= CONFIG.island.goalH) return { type: 'goal' };
  if (y >= H - CONFIG.island.startH) return { type: 'start' };
  return { type: 'water' };
}
/* 상어는 움직이므로 착지하는 순간의 위치로 따로 판정한다 */
function sharkHit(x, y) {
  const s = G.shark;
  if (!s) return false;
  const dx = (x - s.px) / s.rx, dy = (y - s.py) / s.ry;
  return dx * dx + dy * dy <= 1;
}

function newWorld() {
  G.seed = FIXED_SEED !== null ? FIXED_SEED : Math.floor(Math.random() * 4294967296) >>> 0;
  const w = generateWorld(mulberry32(G.seed), G.options);
  G.world = w; G.stones = w.stones; G.shark = w.shark; G.shallow = w.shallow;
  G.sharkLoss = null; G.loseInfo = null;
  jumpRng = FIXED_SEED !== null ? mulberry32(G.seed ^ 0xA5A5A5A5) : Math.random;
  initParticles();
}

/* 계절 입자 (꽃잎·반짝임·낙엽·눈) — 보기 전용 */
function makeParticle(P, initial) {
  const r = Math.random, between = (a) => a[0] + (a[1] - a[0]) * r();
  const p = { f: Math.floor(r() * 4), s: between(P.size), rot: r() * TAU, ph: r() * TAU };
  if (P.mode === 'twinkle') {
    p.x = r() * W; p.y = CONFIG.island.goalH + 10 + r() * (H - CONFIG.island.goalH - CONFIG.island.startH - 20); p.sp = between(P.speed);
  } else {
    p.x = r() * W; p.y = initial ? r() * (H + 40) - 20 : -20 - r() * 40;
    p.vy = between(P.vy); p.vx = between(P.vx); p.vr = (r() - 0.5) * 2 * P.spin;
  }
  return p;
}
function initParticles() {
  const P = theme().particles;
  G.particles = [];
  if (P) for (let i = 0; i < P.count; i++) G.particles.push(makeParticle(P, true));
}
function updateParticles(dt) {
  const P = theme().particles;
  if (!P || P.mode === 'twinkle') return;
  for (let i = 0; i < G.particles.length; i++) {
    const p = G.particles[i];
    p.y += p.vy * dt; p.x += p.vx * dt + Math.sin(G.time * 1.4 + p.ph) * P.sway * dt; p.rot += p.vr * dt;
    if (p.y > H + 24 || p.x < -30 || p.x > W + 30) G.particles[i] = makeParticle(P, false);
  }
}

/* =====================================================================
 * 7. 개구리
 * ===================================================================== */
function startPos(i) {
  return { x: W * CONFIG.frog.startXs[i], y: H - CONFIG.island.startH * (1 - CONFIG.frog.startYRatio) };
}
function makeFrog(i, typeIdx) {
  const p = startPos(i);
  return {
    idx: i, type: CONFIG.frogs[typeIdx], x: p.x, y: p.y, sx: p.x, sy: p.y,
    state: 'idle', stateT: 0, facing: 0, aim: { x: 0, y: -1 },
    pointerId: null, press: { x: p.x, y: p.y }, chargeT: 0,
    jump: null, on: -1, spawnT: 0, phase: Math.random() * TAU
  };
}
function resetFrogs() { G.frogs = [makeFrog(0, G.selection[0]), makeFrog(1, G.selection[1])]; }
function setFrogState(f, s) { f.state = s; f.stateT = 0; }
const chargeRatio = (f) => clamp(f.chargeT / CONFIG.jump.maxCharge, 0, 1);

function updateAim(f) {
  const dx = f.x - f.press.x, dy = f.y - f.press.y, d = Math.hypot(dx, dy);
  if (d >= CONFIG.frog.deadzone) { f.aim.x = dx / d; f.aim.y = dy / d; }   // 누른 지점의 "반대 방향"
  f.facing = Math.atan2(f.aim.y, f.aim.x) + Math.PI / 2;
}

function gauss(rng) {
  let u = 0, v = 0;
  while (!u) u = rng();
  while (!v) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
function sampleAngleError(sigmaDeg) {
  const J = CONFIG.jump;
  let deg;
  if (J.errorDist === 'uniform') deg = (jumpRng() * 2 - 1) * sigmaDeg * Math.sqrt(3);   // 표준편차가 σ가 되도록
  else deg = clamp(gauss(jumpRng), -J.errorClampSigma, J.errorClampSigma) * sigmaDeg;
  return deg * Math.PI / 180;
}

function startJump(f) {
  const J = CONFIG.jump;
  updateAim(f);
  const e = J.ease(chargeRatio(f));
  const dist = (J.minDist + (J.maxDist - J.minDist) * e) * f.type.power;
  const ang = Math.atan2(f.aim.y, f.aim.x) + sampleAngleError(f.type.sigma);        // 점프 순간 각도 오차 적용
  launch(f, clamp(f.x + Math.cos(ang) * dist, 6, W - 6), clamp(f.y + Math.sin(ang) * dist, 6, H - 6));
}

/* 목표 지점이 정해진 점프 시작 (테스트에서 직접 부르기도 함) */
function launch(f, tx, ty) {
  const J = CONFIG.jump;
  const res = judgeLanding(tx, ty);                                                  // 정적인 지형의 착지 결과는 점프 시작 시 결정
  const k = clamp(Math.hypot(tx - f.x, ty - f.y) / (J.maxDist * 1.15), 0, 1);
  f.jump = {
    sx: f.x, sy: f.y, tx, ty, t: 0, u: 0, res,
    dur: lerp(J.durMin, J.durMax, k), height: lerp(J.heightMin, J.heightMax, k)
  };
  f.facing = Math.atan2(ty - f.y, tx - f.x) + Math.PI / 2;
  f.on = -1;
  setFrogState(f, 'jump');
  Sfx.jump();
}

function landFrog(f) {
  const j = f.jump, res = j.res;
  f.x = j.tx; f.y = j.ty; f.jump = null;
  if (res.type === 'goal') { winGame(f); return; }
  if (res.type === 'water') {
    if (G.shark && !G.sharkLoss && sharkHit(f.x, f.y)) { eatFrog(f); return; }       // 상어 위에 착지 → 즉시 패배
    setFrogState(f, 'splash');
    addFx('splash', f.x, f.y, 0.8);
    addFx('ripple', f.x, f.y, 1.1);
    Sfx.splash();
    return;
  }
  if (res.type === 'slippery') { startSlip(f, G.stones[res.stone]); return; }         // 착지는 했지만 미끄러져 빠진다
  setFrogState(f, 'land');
  addFx('dust', f.x, f.y, 0.35);
  if (res.type === 'stone') { f.on = res.stone; G.stones[res.stone].bob = 1; }
  else if (res.type === 'shallow') { f.on = -2; revealShallow(); }
  else f.on = -1;
  Sfx.land();
}

/* 미끄러운 돌: 착지 지점에서 돌 바깥쪽으로 미끄러져 물에 빠진다 */
function startSlip(f, s) {
  const O = CONFIG.options.slippery;
  let dx = f.x - s.x, dy = f.y - s.y, dd = Math.hypot(dx, dy);
  if (dd < 4) { dx = f.aim.x; dy = f.aim.y; dd = Math.hypot(dx, dy) || 1; }          // 정확히 중앙이면 뛰어온 방향으로
  dx /= dd; dy /= dd;
  let t = 0;
  while (t < 400) { const ex = (f.x + dx * t - s.x) / s.rx, ey = (f.y + dy * t - s.y) / s.ry; if (ex * ex + ey * ey >= 1) break; t += 2; }
  const dist = t + O.slideExtra * frogSize();
  f.slip = { sx: f.x, sy: f.y, tx: clamp(f.x + dx * dist, 6, W - 6), ty: clamp(f.y + dy * dist, 6, H - 6), t: 0,
             dur: clamp(dist / 190, O.slideTime[0], O.slideTime[1]) };
  setFrogState(f, 'slip');
  addFx('dust', f.x, f.y, 0.35);
  s.bob = 1;
  Sfx.slip();
}

/* 상어: 착지 순간 상어 몸 안이면 잡아먹힌다 (결과 화면은 잠시 뒤) */
function eatFrog(f) {
  const s = G.shark;
  G.sharkLoss = f; f.pointerId = null;
  s.bite = { t: 0, x: f.x, y: f.y }; s.dir = f.x >= s.px ? 1 : -1;
  setFrogState(f, 'eaten');
  addFx('splash', f.x, f.y, 0.8);
  addFx('ripple', f.x, f.y, 1.1);
  Sfx.bite();
}

/* 얕은 물: 처음 누군가 착지하면 희미한 그림자가 나타난다 */
function revealShallow() {
  const s = G.shallow;
  if (!s || s.revealed) return;
  s.revealed = true; s.revealT = 0;
  addFx('ripple', s.x, s.y, 1.1);
  Sfx.reveal();
}

function respawn(f) {
  const p = startPos(f.idx);
  f.x = p.x; f.y = p.y; f.on = -1; f.aim.x = 0; f.aim.y = -1; f.facing = 0; f.slip = null;
  f.spawnT = CONFIG.frog.spawnTime;
  setFrogState(f, 'idle');
}

function updateFrog(f, dt) {
  f.stateT += dt;
  if (f.spawnT > 0) f.spawnT = Math.max(0, f.spawnT - dt);
  switch (f.state) {
    case 'charge':
      f.chargeT += dt;
      updateAim(f);                                   // 누르는 동안 손가락을 움직이면 방향도 갱신
      break;
    case 'jump': {
      const j = f.jump;
      j.t += dt;
      j.u = Math.min(1, j.t / j.dur);
      f.x = lerp(j.sx, j.tx, j.u); f.y = lerp(j.sy, j.ty, j.u);
      if (j.u >= 1) landFrog(f);
      break;
    }
    case 'land':
      if (f.stateT >= CONFIG.frog.landTime) setFrogState(f, 'idle');
      break;
    case 'slip': {
      const s = f.slip;
      s.t += dt;
      const u = Math.min(1, s.t / s.dur), e = Math.pow(u, 1.5);                   // 천천히 시작해 점점 빨라진다
      f.x = lerp(s.sx, s.tx, e); f.y = lerp(s.sy, s.ty, e);
      if (u >= 1) {
        f.slip = null;
        setFrogState(f, 'splash');
        addFx('splash', f.x, f.y, 0.8); addFx('ripple', f.x, f.y, 1.1);
        Sfx.splash();
      }
      break;
    }
    case 'splash':
      if (f.stateT >= CONFIG.frog.splashTime) respawn(f);
      break;
    default: break;                                   // eaten: 결과 화면으로 넘어갈 때까지 숨김
  }
}

function updateShark(dt) {
  const s = G.shark;
  if (!s) return;
  if (s.bite) {                                       // 잡아먹는 중: 개구리 쪽으로 달려들었다가 잠시 뒤 원래 동선으로
    s.bite.t += dt;
    const k = Math.min(1, dt * 26);
    s.px += (s.bite.x - s.px) * k; s.py += (s.bite.y - s.py) * k;
    if (s.bite.t > 1.8) s.bite = null;
  } else {
    s.t += dt;
    const ph = TAU * s.t / s.period + s.phase, k = Math.min(1, dt * 12);
    s.px += (s.cx + s.swing * Math.sin(ph) - s.px) * k; s.py += (s.y - s.py) * k;
    s.dir = Math.cos(ph) >= 0 ? 1 : -1;
  }
}

/* info.shark: 상어에게 잡아먹혀 상대가 승리한 경우 */
function winGame(winner, info) {
  G.winner = winner;
  G.loseInfo = info && info.shark ? { type: 'shark', loser: info.loser } : null;
  if (!G.loseInfo) winner.y = Math.max(winner.y, 70);  // 결승선 너머 화면 끝에 걸쳐 착지해도 승자가 잘 보이게
  setFrogState(winner, 'win');
  for (const f of G.frogs) {
    f.pointerId = null;
    if (f === winner) continue;
    f.jump = null;
    if (f.state === 'eaten') continue;                 // 잡아먹힌 개구리는 계속 숨김
    if (f.state === 'splash' || f.state === 'slip') respawn(f);
    setFrogState(f, 'lose');
  }
  for (let i = 0; i < 80; i++) {
    G.confetti.push({
      x: Math.random() * W, y: -Math.random() * 500, vy: 120 + Math.random() * 160, vx: (Math.random() - 0.5) * 40,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 8, s: 6 + Math.random() * 8, c: i % 4,
      ph: Math.random() * TAU
    });
  }
  Sfx.win();
  setState('result');
  unlockScreen();
}

/* =====================================================================
 * 8. 이펙트
 * ===================================================================== */
function addFx(type, x, y, dur) { G.fx.push({ type, x, y, t: 0, dur }); }

function drawFx(e) {
  const key = 'fx_' + e.type;
  if (drawSprite(key, e.x, e.y, { t: e.t })) return;
  const u = clamp(e.t / e.dur, 0, 1);
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.type === 'splash') {
    for (let r = 0; r < 2; r++) {
      const p = clamp(u * 1.2 - r * 0.25, 0, 1);
      ctx.globalAlpha = (1 - p) * 0.85; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ell(0, 0, 10 + p * 46, (10 + p * 46) * 0.55); ctx.stroke();
    }
    for (let i = 0; i < 10; i++) {
      const a = i * TAU / 10 + 0.3, v = 30 + (i % 3) * 14, k = easeOut(u);
      const px = Math.cos(a) * v * k, py = Math.sin(a) * v * 0.5 * k - Math.sin(u * Math.PI) * (28 + (i % 4) * 8);
      ctx.globalAlpha = 1 - u; ctx.fillStyle = '#e6f7ff';
      ctx.beginPath(); ctx.arc(px, py, 4 * (1 - u) + 1, 0, TAU); ctx.fill();
    }
  } else if (e.type === 'ripple') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.globalAlpha = (1 - u) * 0.6;
    ell(0, 0, 20 + u * 60, (20 + u * 60) * 0.55); ctx.stroke();
  } else if (e.type === 'dust') {
    ctx.globalAlpha = (1 - u) * 0.7; ctx.strokeStyle = '#f4efe0'; ctx.lineWidth = 4 * (1 - u) + 1;
    ell(0, 0, 14 + u * 26, (14 + u * 26) * 0.5); ctx.stroke();
  }
  ctx.restore();
}

function drawConfetti() {
  const colors = ['#ff5c5c', '#ffd23f', '#3da5ff', '#6cc24a'];
  for (const p of G.confetti) {
    if (p.y > H + 20) continue;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (!drawSprite('fx_confetti', 0, 0, { frame: p.c, sx: p.s / 10, sy: p.s / 10 })) {
      ctx.fillStyle = colors[p.c];
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    }
    ctx.restore();
  }
}

/* =====================================================================
 * 9. 입력 — Pointer Events, pointerId 추적으로 멀티터치 2인 동시 조작
 * ===================================================================== */
const ui = { cur: [], last: [], pressed: new Map() };

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function hitButton(p) {
  for (let i = ui.last.length - 1; i >= 0; i--) {
    const b = ui.last[i];
    if (!b.disabled && Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2) return b;
  }
  return null;
}
function pickFrog(p) {
  if (G.sharkLoss) return null;                                 // 상어에게 잡아먹힌 뒤에는 입력 없음
  let best = null, bd = CONFIG.frog.touchRadius;
  for (const f of G.frogs) {
    if (f.pointerId !== null) continue;
    if (f.state !== 'idle' && f.state !== 'land') continue;     // 점프·물에 빠짐·종료 후에는 입력 무시
    const d = Math.hypot(f.x - p.x, f.y - p.y);
    if (d <= bd) { bd = d; best = f; }
  }
  return best;
}
function cancelAllCharges() {
  for (const f of G.frogs) {
    if (f.pointerId !== null || f.state === 'charge') { f.pointerId = null; if (f.state === 'charge') setFrogState(f, 'idle'); }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  Sfx.unlock();
  const p = toLogical(e);
  const b = hitButton(p);
  if (b) {
    ui.pressed.set(e.pointerId, b.id);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    return;
  }
  if (G.state === 'playing') {
    const f = pickFrog(p);
    if (f) {
      f.pointerId = e.pointerId; f.press = p; f.chargeT = 0;
      setFrogState(f, 'charge'); updateAim(f);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    }
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (G.state !== 'playing') return;
  const f = G.frogs.find((fr) => fr.pointerId === e.pointerId);
  if (f && f.state === 'charge') f.press = toLogical(e);
});
function onPointerEnd(e, cancelled) {
  const bid = ui.pressed.get(e.pointerId);
  if (bid !== undefined) {
    ui.pressed.delete(e.pointerId);
    if (!cancelled) {
      const b = hitButton(toLogical(e));
      if (b && b.id === bid && b.onClick) { Sfx.click(); b.onClick(); }
    }
    return;
  }
  for (const f of G.frogs) {
    if (f.pointerId !== e.pointerId) continue;
    f.pointerId = null;
    if (f.state !== 'charge') continue;
    f.press = toLogical(e);
    if (cancelled || G.state !== 'playing') setFrogState(f, 'idle'); else startJump(f);   // 손가락을 떼는 순간 점프
  }
}
canvas.addEventListener('pointerup', (e) => onPointerEnd(e, false));
canvas.addEventListener('pointercancel', (e) => onPointerEnd(e, true));

/* 더블탭/핀치 줌/롱프레스 메뉴/스크롤 방지 */
['contextmenu', 'dblclick', 'gesturestart', 'gesturechange', 'gestureend', 'selectstart'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1 && e.cancelable) e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', (e) => {          // 데스크톱 편의: P / Esc 로 일시정지
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (G.state === 'playing') pauseGame(); else if (G.state === 'paused') resumeGame();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'playing') pauseGame(); }
  else if (['countdown', 'playing', 'paused'].includes(G.state)) lockScreen();
});

/* =====================================================================
 * 10. 상태 머신
 * ===================================================================== */
let wakeLock = null;
async function lockScreen() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 지원하지 않거나 거부됨 */ }
}
function unlockScreen() { try { if (wakeLock) wakeLock.release(); } catch (e) { /* 무시 */ } wakeLock = null; }

function setState(s) { G.state = s; G.stateT = 0; }
function goTitle() { cancelAllCharges(); unlockScreen(); G.fx.length = 0; G.confetti.length = 0; G.winner = null; newWorld(); resetFrogs(); setState('title'); }
function goSelect() { cancelAllCharges(); unlockScreen(); G.fx.length = 0; G.confetti.length = 0; G.winner = null; newWorld(); resetFrogs(); setState('select'); }
function goOptions() { cancelAllCharges(); unlockScreen(); G.fx.length = 0; G.confetti.length = 0; G.winner = null; newWorld(); resetFrogs(); setState('options'); }
function setTheme(id) { if (id === G.theme) return; G.theme = id; savePrefs(); initParticles(); }
function toggleOption(k) { G.options[k] = !G.options[k]; savePrefs(); newWorld(); resetFrogs(); }
function startMatch() {
  newWorld();                                          // 다시 시작할 때마다 돌 배치를 새로 생성
  resetFrogs();
  G.fx.length = 0; G.confetti.length = 0; G.winner = null;
  G.elapsed = 0; G.goT = 99; G.lastCount = 4;
  setState('countdown');
  lockScreen();
}
function pauseGame() { if (G.state !== 'playing') return; cancelAllCharges(); setState('paused'); }
function resumeGame() { if (G.state === 'paused') setState('playing'); }

function update(dt) {
  if (G.state === 'paused') return;
  G.time += dt; G.stateT += dt;
  for (const s of G.stones) if (s.bob > 0) s.bob = Math.max(0, s.bob - dt * 2.5);
  for (let i = G.fx.length - 1; i >= 0; i--) { G.fx[i].t += dt; if (G.fx[i].t >= G.fx[i].dur) G.fx.splice(i, 1); }
  for (const p of G.confetti) { p.y += p.vy * dt; p.x += p.vx * dt + Math.sin(G.time * 3 + p.ph) * 0.6; p.rot += p.vr * dt; }

  if (G.state === 'countdown') {
    const step = CONFIG.game.countdownStep, n = 3 - Math.floor(G.stateT / step);
    if (n !== G.lastCount && n >= 1) { G.lastCount = n; Sfx.tick(); }
    if (G.stateT >= step * 3) { setState('playing'); G.goT = 0; Sfx.go(); }
  } else if (G.state === 'playing') {
    G.elapsed += dt; G.goT += dt;
  }
  updateShark(dt);                                     // 착지 판정에 쓰이므로 개구리보다 먼저
  updateParticles(dt);
  if (G.shallow && G.shallow.revealed) G.shallow.revealT += dt;
  for (const f of G.frogs) updateFrog(f, dt);
  if (G.sharkLoss && G.state === 'playing') {          // 상어에게 잡아먹힘 → 상대 승리 (상대가 점프 중이면 착지 뒤에)
    const loser = G.sharkLoss, other = G.frogs[1 - loser.idx];
    if (other.state !== 'jump' && loser.stateT >= CONFIG.options.shark.biteTime) {
      if (other.state === 'splash' || other.state === 'slip') respawn(other);
      winGame(other, { shark: true, loser });
    }
  }
}

/* =====================================================================
 * 11. 렌더링 — 월드
 * ===================================================================== */
const ripples = Array.from({ length: 30 }, () => ({
  x: Math.random() * W, y: CONFIG.island.goalH + Math.random() * (H - CONFIG.island.goalH - CONFIG.island.startH),
  w: 24 + Math.random() * 30, h: 8 + Math.random() * 10, speed: 0.15 + Math.random() * 0.2, phase: Math.random()
}));

function drawWater(tid, ambient = true) {
  const pal = theme(tid).pal;
  if (!drawSprite('bg_water', 0, 0, { theme: tid })) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, pal.waterA); g.addColorStop(1, pal.waterB);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (!ambient) return;
  ctx.save(); ctx.strokeStyle = `rgb(${pal.ripple})`; ctx.lineWidth = 2;   // 잔물결 (이미지 위에도 은은하게)
  for (const r of ripples) {
    const p = (G.time * r.speed + r.phase) % 1;
    ctx.globalAlpha = (1 - p) * 0.22;
    ell(r.x, r.y, r.w * (0.4 + p * 0.6), r.h * (0.4 + p * 0.6)); ctx.stroke();
  }
  ctx.restore();
}

function islandPlaceholder(top, bottom, edgeY, goal, pal) {
  ctx.save();
  const g = ctx.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, pal.landA); g.addColorStop(1, pal.landB);
  ctx.fillStyle = g;
  ctx.beginPath();
  const dirOut = goal ? 1 : -1;                      // 강 쪽으로 약간 물결치는 해안선
  ctx.moveTo(0, goal ? top : bottom);
  ctx.lineTo(0, edgeY);
  for (let x = 0; x <= W; x += 18) ctx.lineTo(x, edgeY + dirOut * (3 + Math.sin(x * 0.045 + G.time * 1.2) * 3));
  ctx.lineTo(W, goal ? top : bottom);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 4;   // 판정 경계선과 일치하는 거품 선
  ctx.beginPath(); ctx.moveTo(0, edgeY); ctx.lineTo(W, edgeY); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  for (let i = 0; i < 9; i++) { ell(30 + i * 62, (top + bottom) / 2 + ((i * 37) % 40) - 20, 20, 7); ctx.fill(); }
  if (goal) {                                         // 도착 섬: 체크무늬 결승선
    const y0 = edgeY - 14;
    for (let i = 0; i < 27; i++) { ctx.fillStyle = i % 2 ? '#fff' : '#1b2a33'; ctx.fillRect(i * 20, y0, 20, 7); ctx.fillStyle = i % 2 ? '#1b2a33' : '#fff'; ctx.fillRect(i * 20, y0 + 7, 20, 7); }
  }
  ctx.restore();
}

function drawIslands(tid) {
  const gh = CONFIG.island.goalH, sh = CONFIG.island.startH, pal = theme(tid).pal;
  if (!drawSprite('island_goal', 0, 0, { theme: tid })) islandPlaceholder(0, gh, gh, true, pal);
  if (!drawSprite('island_start', 0, H - sh, { theme: tid })) islandPlaceholder(H - sh, H, H - sh, false, pal);
}

function stonePlaceholder(x, y, rx, ry, pal, slick, idx) {
  ctx.save();
  const g = ctx.createRadialGradient(x - rx * 0.3, y - ry * 0.4, 2, x, y, rx);
  g.addColorStop(0, pal.stoneA); g.addColorStop(1, pal.stoneB);
  ctx.fillStyle = g; ell(x, y, rx, ry); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = pal.stoneEdge; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ell(x - rx * 0.28, y - ry * 0.35, rx * 0.4, ry * 0.22); ctx.fill();
  if (slick) {                                        // 미끄러운 돌: 푸른 윤기 + 이끼 줄무늬 + 반짝이는 하이라이트
    ctx.globalAlpha = 0.5; ctx.fillStyle = pal.slick; ell(x, y, rx * 0.96, ry * 0.9); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(80,170,90,0.55)';
    ell(x + rx * 0.3, y + ry * 0.25, rx * 0.3, ry * 0.13, 0.2); ctx.fill();
    ell(x - rx * 0.35, y + ry * 0.38, rx * 0.22, ry * 0.1, -0.2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ell(x - rx * 0.2, y - ry * 0.3, rx * 0.35, ry * 0.14); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(88,140,70,0.45)';           // 이끼 (돌마다 고정된 모양)
    ell(x + rx * 0.45, y + ry * 0.2, rx * 0.2, ry * 0.18, 0.4); ctx.fill();
    ell(x + rx * (-0.5 + (idx % 3) * 0.1), y + ry * 0.35, rx * 0.14, ry * 0.12); ctx.fill();
  }
  ctx.restore();
}

/* 미끄러운 돌 위에서 반짝이는 하이라이트 (눈에 띄게) */
function drawGlints(s, rx, ry) {
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 2; i++) {
    const a = Math.max(0, Math.sin(G.time * 2.2 + i * 2.1 + s.idx)), px = s.x + (i ? 0.35 : -0.3) * rx, py = s.y + (i ? 0.12 : -0.18) * ry;
    const r = (2.5 + 4 * a) * Math.min(1, rx / 50 + 0.4);
    ctx.globalAlpha = a * 0.95;
    ctx.beginPath(); ctx.moveTo(px - r, py); ctx.lineTo(px + r, py); ctx.moveTo(px, py - r * 0.9); ctx.lineTo(px, py + r * 0.9); ctx.stroke();
  }
  ctx.restore();
}

function drawStone(s, tid, preview) {
  const vs = CONFIG.stone.visualScale;
  const bob = s.bob > 0 ? 1 - Math.sin((1 - s.bob) * Math.PI) * 0.07 : 1;
  const rx = s.rx * vs * bob, ry = s.ry * vs * bob;
  ctx.save(); ctx.fillStyle = 'rgba(0,40,60,0.24)'; ell(s.x + 3, s.y + 6, rx, ry); ctx.fill(); ctx.restore();   // 그림자는 항상 코드로
  if (!drawSprite(s.slippery ? 'stone_slippery' : 'stone', s.x, s.y, { w: rx * 2, h: ry * 2, theme: tid })) {
    stonePlaceholder(s.x, s.y, rx, ry, theme(tid).pal, s.slippery, s.idx || 0);
  }
  if (s.slippery && !preview) drawGlints(s, rx, ry);
}

/* 얕은 물: 첫 접촉 뒤에만 희미한 그림자가 보인다 (그 전에는 아무것도 그리지 않음) */
function drawShallow() {
  const s = G.shallow;
  if (!s || !s.revealed) return;
  const a = clamp(s.revealT / CONFIG.options.shallow.revealTime, 0, 1);
  if (drawSprite('fx_shallow', s.x, s.y, { w: s.rx * 2 * 1.3, h: s.ry * 2 * 1.3, alpha: a })) return;
  ctx.save();
  ctx.globalAlpha = a * 0.3; ctx.fillStyle = '#04283a'; ell(s.x, s.y, s.rx * 1.1, s.ry * 1.1); ctx.fill();
  ctx.globalAlpha = a * 0.35; ctx.strokeStyle = `rgb(${theme().pal.ripple})`; ctx.lineWidth = 2; ell(s.x, s.y, s.rx * 1.25, s.ry * 1.25); ctx.stroke();
  ctx.restore();
}

function sharkPlaceholder(s, pulse) {
  const L = s.rx * 1.3 * pulse, B = s.ry * 1.05 * pulse, wob = Math.sin(G.time * 9) * B * 0.35;
  ctx.save(); ctx.translate(s.px, s.py); ctx.scale(s.dir, 1); ctx.globalAlpha = 0.95;
  const g = ctx.createLinearGradient(0, -B, 0, B); g.addColorStop(0, '#53667a'); g.addColorStop(1, '#8aa0b2');
  ctx.fillStyle = g; ctx.strokeStyle = '#2f3f50'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(L, 0);
  ctx.bezierCurveTo(L * 0.5, -B, -L * 0.4, -B * 0.8, -L * 0.8, -B * 0.12 + wob * 0.3);
  ctx.lineTo(-L * 1.15, -B * 0.85 + wob); ctx.lineTo(-L * 0.98, wob * 0.5); ctx.lineTo(-L * 1.15, B * 0.85 + wob); ctx.lineTo(-L * 0.8, B * 0.12 + wob * 0.3);
  ctx.bezierCurveTo(-L * 0.4, B * 0.8, L * 0.5, B, L, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3d4f61';
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(L * 0.3, sd * B * 0.55); ctx.lineTo(-L * 0.05, sd * B * 1.35); ctx.lineTo(-L * 0.15, sd * B * 0.55); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(L * 0.2, 0); ctx.lineTo(-L * 0.3, -B * 0.2); ctx.lineTo(-L * 0.5, 0); ctx.lineTo(-L * 0.3, B * 0.2); ctx.closePath(); ctx.fill(); ctx.stroke();   // 등지느러미
  ctx.fillStyle = '#10202c';
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(L * 0.68, sd * B * 0.38, 2, 0, TAU); ctx.fill(); }
  ctx.restore();
}

function drawShark() {
  const s = G.shark;
  if (!s) return;
  const pulse = s.bite ? 1 + 0.3 * Math.sin(Math.min(1, s.bite.t / 0.4) * Math.PI) : 1;   // 잡아먹을 때 확 커졌다 줄어든다
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;               // 헤엄칠 때 생기는 물결
  for (let i = 0; i < 2; i++) {
    const k = (G.time * 0.9 + i * 0.5) % 1;
    ctx.globalAlpha = (1 - k) * 0.4;
    ell(s.px - s.dir * (s.rx * 0.9 + k * 14), s.py + 2, s.rx * (0.8 + k * 0.7), s.ry * (0.7 + k * 0.6)); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = '#031a28'; ell(s.px + 2, s.py + 6, s.rx * 1.15 * pulse, s.ry * 1.1 * pulse); ctx.fill(); ctx.restore();   // 물속 그림자(눈에 잘 띄도록)
  const w = s.rx * 2 * 1.3 * pulse;
  if (!drawSprite('shark', s.px, s.py, { w, h: w / 2, sx: s.dir, alpha: 0.96 })) sharkPlaceholder(s, pulse);
}

/* 계절 입자: 'twinkle'(반짝임)은 물 위, 'fall'(꽃잎·낙엽·눈)은 개구리 위에 그린다 */
function drawParticles(mode) {
  const t = theme(), P = t.particles;
  if (!P || P.mode !== mode) return;
  ctx.save();
  for (const p of G.particles) {
    let a = P.alpha || 1;
    if (mode === 'twinkle') a *= Math.pow(Math.max(0, Math.sin(G.time * p.sp + p.ph)), 2);
    if (a <= 0.02) continue;
    if (drawSprite('fx_season', p.x, p.y, { frame: p.f, w: p.s, h: p.s, rot: p.rot, alpha: a })) continue;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = a; ctx.fillStyle = t.pal.pc[p.f % t.pal.pc.length];
    if (mode === 'twinkle') {
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-p.s * 0.4, 0); ctx.lineTo(p.s * 0.4, 0); ctx.moveTo(0, -p.s * 0.4); ctx.lineTo(0, p.s * 0.4); ctx.stroke();
    } else { ell(0, 0, p.s * 0.5, p.s * 0.28); ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();
}

/* --- 개구리 임시 그래픽 (위쪽을 보는 탑뷰) --- */
function drawFrogBody(type, state, sx, sy) {
  const R = CONFIG.frog.radius, col = type.color, dark = type.dark;
  ctx.save();
  ctx.scale(sx, sy);
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = dark; ctx.fillStyle = col;
  let a = 0.95, L = R * 0.95;                                    // 뒷다리 각도/길이
  if (state === 'charge') { a = 1.2; L = R * 0.75; }
  else if (state === 'jump') { a = 0.12; L = R * 1.55; }
  for (const s of [-1, 1]) {
    const hx = s * R * 0.7, hy = R * 0.45, dx = s * Math.sin(a), dy = Math.cos(a);
    ctx.fillStyle = col; ell(hx + dx * L * 0.5, hy + dy * L * 0.5, L * 0.58, R * 0.27, Math.atan2(dy, dx)); ctx.fill(); ctx.stroke();
    ctx.fillStyle = dark; ell(hx + dx * L * 0.98, hy + dy * L * 0.98, R * 0.22, R * 0.16, Math.atan2(dy, dx)); ctx.fill();
    const fdx = s * (state === 'jump' ? 0.4 : 0.95), fdy = state === 'jump' ? 0.9 : 0.4;   // 앞다리
    ctx.fillStyle = col; ell(s * R * 0.62 + fdx * R * 0.3, -R * 0.15 + fdy * R * 0.3, R * 0.36, R * 0.15, Math.atan2(fdy, fdx)); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = col; ell(0, 0, R * 0.82, R * 1.0); ctx.fill(); ctx.stroke();                 // 몸통
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ell(0, R * 0.12, R * 0.48, R * 0.62); ctx.fill();
  ctx.fillStyle = dark; ctx.globalAlpha = 0.45;                                               // 등 무늬
  for (const [px, py, pr] of [[-0.3, 0.1, 0.17], [0.28, 0.3, 0.15], [0, 0.55, 0.13]]) { ctx.beginPath(); ctx.arc(px * R, py * R, pr * R, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = col; ell(0, -R * 0.78, R * 0.68, R * 0.52); ctx.fill(); ctx.stroke();       // 머리
  for (const s of [-1, 1]) {
    const ex = s * R * 0.42, ey = -R * 1.0;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ex, ey, R * 0.3, 0, TAU); ctx.fill(); ctx.stroke();
    if (state === 'win') {                                         // ^ ^ 웃는 눈
      ctx.strokeStyle = '#17321f'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(ex, ey + R * 0.08, R * 0.16, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); ctx.strokeStyle = dark; ctx.lineWidth = 2.5;
    } else if (state === 'lose') {                                  // X 눈
      ctx.strokeStyle = '#17321f'; ctx.lineWidth = 2.5; const k = R * 0.13;
      ctx.beginPath(); ctx.moveTo(ex - k, ey - k); ctx.lineTo(ex + k, ey + k); ctx.moveTo(ex + k, ey - k); ctx.lineTo(ex - k, ey + k); ctx.stroke(); ctx.strokeStyle = dark;
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, R * 0.22, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1b2a22'; ctx.beginPath(); ctx.arc(ex, ey - R * 0.04, R * 0.11, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

/* 개구리 한 마리를 그리는 공통 함수 (스프라이트 우선, 없으면 임시 그래픽) */
function drawFrogVisual(type, state, x, y, o = {}) {
  const key = `frog_${type.id}_${state}`, idleKey = `frog_${type.id}_idle`;
  const useKey = Sprites.images[key] ? key : (Sprites.images[idleKey] ? idleKey : null);
  const scale = o.scale || 1, sx = (o.sx || 1) * scale, sy = (o.sy || 1) * scale;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (useKey) {
    const rot = ASSETS[useKey].rotate ? (o.rot || 0) : 0;
    drawSprite(useKey, x, y, { rot, sx, sy, t: o.t });
  } else {
    ctx.translate(x, y); ctx.rotate(o.rot || 0);
    drawFrogBody(type, state === 'slip' ? 'jump' : state, sx, sy);
  }
  ctx.restore();
}

function drawPlayerRing(f, x, y) {
  const col = CONFIG.players[f.idx].color, R = CONFIG.frog.radius;
  if (drawSprite('ui_ring_p' + (f.idx + 1), x, y + 4)) return;
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.globalAlpha = 0.95;
  ell(x, y + 4, R * 1.35, R * 0.95); ctx.stroke();
  ctx.globalAlpha = 0.2; ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}
function drawBadge(f, x, y) {
  if (drawSprite('ui_badge_p' + (f.idx + 1), x, y)) return;
  const col = CONFIG.players[f.idx].color;
  ctx.save();
  ctx.fillStyle = col; rrect(x - 20, y - 11, 40, 22, 11); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
  text(CONFIG.players[f.idx].label, x, y + 1, { size: 15, stroke: false });
}

function drawFrog(f) {
  const R = CONFIG.frog.radius;
  if (f.state === 'splash' || f.state === 'eaten') return;           // 물속으로 잠김 / 상어에게 잡아먹힘 (이펙트는 fx로 표현)
  let gx = f.x, gy = f.y, h = 0, scale = 1, sx = 1, sy = 1, alpha = 1, rot = f.facing;
  if (f.spawnT > 0) alpha = 1 - f.spawnT / CONFIG.frog.spawnTime * 0.8;
  switch (f.state) {
    case 'idle': { const b = Math.sin(G.time * 3 + f.phase) * 0.025; sx = 1 + b; sy = 1 - b; break; }
    case 'charge': { const r = chargeRatio(f); sx = 1 + 0.14 * r; sy = 1 - 0.14 * r; if (r >= 1) gx += Math.sin(G.time * 60) * 1.2; break; }
    case 'jump': { const u = f.jump.u, arc = 4 * u * (1 - u); h = f.jump.height * arc; scale = 1 + 0.3 * arc; sx = 0.92; sy = 1.12; break; }
    case 'land': { const k = 1 - f.stateT / CONFIG.frog.landTime; sx = 1 + 0.2 * k; sy = 1 - 0.16 * k; break; }
    case 'win': h = Math.abs(Math.sin(f.stateT * 7)) * 16; rot = Math.sin(f.stateT * 5) * 0.25; break;
    case 'slip': { const u = clamp(f.slip.t / f.slip.dur, 0, 1); rot = f.facing + u * TAU * 0.75; scale = 1 - 0.22 * u; alpha = 1 - 0.3 * u * u; break; }   // 빙글 돌며 미끄러진다
    case 'lose': alpha = 0.85; rot = f.facing + 0.35; sy = 0.92; break;
    default: break;
  }
  // 그림자 + 플레이어 링 (지면 기준)
  const sh = 1 - Math.min(0.4, h / 120);
  if (!drawSprite('fx_shadow', gx, gy + 8, { sx: sh, sy: sh, alpha: 0.5 })) {
    ctx.save(); ctx.globalAlpha = 0.22 * sh; ctx.fillStyle = '#05202e'; ell(gx, gy + 8, R * 0.95 * sh, R * 0.5 * sh); ctx.fill(); ctx.restore();
  }
  if (f.state !== 'jump') drawPlayerRing(f, gx, gy);
  drawFrogVisual(f.type, f.state, gx, gy - h, { rot, scale, sx, sy, alpha, t: f.stateT });
  if (f.state !== 'jump') drawBadge(f, gx, gy + R + 22);
}

function drawChargeUI(f) {
  const R = CONFIG.frog.radius, r = chargeRatio(f), col = CONFIG.players[f.idx].color;
  // 방향 화살표 (실제 점프 방향 = 누른 지점의 반대쪽)
  const ang = Math.atan2(f.aim.y, f.aim.x), len = 34 + r * 56;
  const ox = f.x + f.aim.x * R * 0.9, oy = f.y + f.aim.y * R * 0.9;
  if (!drawSprite('ui_arrow', ox, oy, { rot: ang + Math.PI / 2, h: len })) {
    ctx.save();
    ctx.translate(ox, oy); ctx.rotate(ang);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len - 12, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(len - 22, -14); ctx.lineTo(len - 22, 14); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len - 12, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(len - 1, 0); ctx.lineTo(len - 20, -11); ctx.lineTo(len - 20, 11); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    ctx.restore();
  }
  // 차징 게이지 (개구리 위, 화면 위쪽이면 아래)
  const gy = f.y - R - 40 < 24 ? f.y + R + 52 : f.y - R - 40, gw = 64, gh = 12;
  if (drawSprite('ui_gauge_bg', f.x, gy)) {
    drawSprite('ui_gauge_fill', f.x, gy, { crop: r, w: gw, h: gh });
  } else {
    ctx.save();
    ctx.fillStyle = 'rgba(0,25,40,0.75)'; rrect(f.x - gw / 2 - 3, gy - gh / 2 - 3, gw + 6, gh + 6, 8); ctx.fill();
    if (r > 0) {
      ctx.fillStyle = `hsl(${120 - 100 * r}, 85%, 55%)`;
      rrect(f.x - gw / 2, gy - gh / 2, Math.max(gh, gw * r), gh, 6); ctx.fill();
    }
    if (r >= 1 && Math.floor(G.time * 10) % 2 === 0) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; rrect(f.x - gw / 2 - 3, gy - gh / 2 - 3, gw + 6, gh + 6, 8); ctx.stroke(); }
    ctx.restore();
  }
}

function drawWorld() {
  drawWater();
  drawIslands();
  drawParticles('twinkle');
  if (DEBUG) text(`seed ${G.seed}`, 8, H - 14, { size: 14, align: 'left', alpha: 0.8 });
  else if (FIXED_SEED !== null) text(`seed ${G.seed}`, 8, H - 14, { size: 14, align: 'left', alpha: 0.5 });
  drawShallow();
  for (const s of G.stones) drawStone(s);
  drawShark();
  for (const e of G.fx) if (e.type === 'ripple') drawFx(e);
  const order = G.frogs.slice().sort((a, b) => (a.state === 'jump') - (b.state === 'jump') || a.y - b.y);
  for (const f of order) drawFrog(f);
  drawParticles('fall');
  for (const e of G.fx) if (e.type !== 'ripple') drawFx(e);
  for (const f of G.frogs) if (f.state === 'charge') drawChargeUI(f);
  if (DEBUG) {                                          // 판정 영역 표시: 노랑=돌, 하늘=개구리 터치, 빨강=상어, 초록=얕은 물(숨겨진 것도 표시)
    ctx.save(); ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#ff0'; for (const s of G.stones) { ell(s.x, s.y, s.rx * CONFIG.stone.landingSlack, s.ry * CONFIG.stone.landingSlack); ctx.stroke(); }
    ctx.strokeStyle = '#0ff'; for (const f of G.frogs) { ctx.beginPath(); ctx.arc(f.x, f.y, CONFIG.frog.touchRadius, 0, TAU); ctx.stroke(); }
    if (G.shark) { ctx.strokeStyle = '#f44'; ell(G.shark.px, G.shark.py, G.shark.rx, G.shark.ry); ctx.stroke(); ctx.strokeRect(G.shark.cx - G.shark.half, G.shark.y - G.shark.ry, G.shark.half * 2, G.shark.ry * 2); }
    if (G.shallow) { ctx.strokeStyle = '#4f4'; ell(G.shallow.x, G.shallow.y, G.shallow.rx, G.shallow.ry); ctx.stroke(); }
    ctx.restore();
  }
}

/* =====================================================================
 * 12. 렌더링 — UI (즉시 모드: 그리면서 버튼 영역을 등록)

function button(o) {
  ui.cur.push(o);
  if (o.custom) return;                                  // 모양을 호출한 쪽에서 직접 그리는 버튼(카드 등)
  const down = Array.from(ui.pressed.values()).includes(o.id);
  const oy = down ? 3 : 0, variant = o.variant || (o.icon ? 'sub' : 'primary');
  const key = o.icon ? 'ui_btn_icon' : (variant === 'primary' ? 'ui_btn' : 'ui_btn_sub');
  if (!drawSprite(key, o.x, o.y + oy, { w: o.w, h: o.h })) {
    const r = Math.min(o.h / 2, 24);
    ctx.save();
    ctx.translate(o.x, o.y + oy);
    if (!down) { ctx.fillStyle = 'rgba(0,0,0,0.3)'; rrect(-o.w / 2, -o.h / 2 + 5, o.w, o.h, r); ctx.fill(); }
    const c = variant === 'primary' ? ['#9be85f', '#3fa33a', 'rgba(10,60,20,0.6)'] : ['#7fc4ee', '#3b86bb', 'rgba(10,40,70,0.6)'];
    const g = ctx.createLinearGradient(0, -o.h / 2, 0, o.h / 2);
    g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
    ctx.fillStyle = g; rrect(-o.w / 2, -o.h / 2, o.w, o.h, r); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = c[2]; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; rrect(-o.w / 2 + 6, -o.h / 2 + 5, o.w - 12, o.h * 0.38, r * 0.8); ctx.fill();
    ctx.restore();
  }
  if (o.icon) drawIcon(o.icon, o.x, o.y + oy);
  if (o.label) text(o.label, o.x, o.y + oy + 1, { size: o.size || Math.round(o.h * 0.42), maxW: o.w - 24 });
}

function drawIcon(name, x, y) {
  const key = 'icon_' + name;
  if (drawSprite(key, x, y)) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'pause') { rrect(-9, -11, 7, 22, 2); ctx.fill(); rrect(2, -11, 7, 22, 2); ctx.fill(); }
  else {                                                         // sound_on / sound_off: 스피커
    ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-6, -5); ctx.lineTo(1, -11); ctx.lineTo(1, 11); ctx.lineTo(-6, 5); ctx.lineTo(-12, 5); ctx.closePath(); ctx.fill();
    if (name === 'sound_on') { ctx.beginPath(); ctx.arc(2, 0, 8, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(2, 0, 14, -0.9, 0.9); ctx.stroke(); }
    else { ctx.strokeStyle = '#ff7a7a'; ctx.beginPath(); ctx.moveTo(7, -7); ctx.lineTo(17, 7); ctx.moveTo(17, -7); ctx.lineTo(7, 7); ctx.stroke(); }
  }
  ctx.restore();
}

function panel(x, y, w, h, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  if (!drawSprite('ui_panel', x, y, { w, h })) {
    ctx.fillStyle = 'rgba(6,34,50,0.82)'; rrect(x - w / 2, y - h / 2, w, h, 26); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
  }
  ctx.restore();
}
function dim(a) { ctx.save(); ctx.fillStyle = `rgba(3,20,30,${a})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }

function drawOptIcon(k, x, y) {
  if (drawSprite('icon_opt_' + k, x, y)) return;

  if (k === 'shark') {

    ctx.beginPath(); ctx.moveTo(-14, 8); ctx.lineTo(-2, -16); ctx.lineTo(4, -2); ctx.lineTo(16, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#bfe7ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, 12); ctx.quadraticCurveTo(-10, 6, 0, 12); ctx.quadraticCurveTo(10, 18, 20, 12); ctx.stroke();
  } else if (k === 'slippery') {
    ctx.fillStyle = '#c9c4b6'; ell(0, 4, 19, 11); ctx.fill(); ctx.strokeStyle = '#6a665b'; ctx.lineWidth = 2.5; ctx.stroke();

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(8, -6); ctx.moveTo(3, -11); ctx.lineTo(13, -11); ctx.stroke();
  } else {
    ctx.strokeStyle = '#bfe7ff'; ctx.lineWidth = 3; ell(0, 2, 18, 11); ctx.stroke();

}

function render() {
  ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
  ui.cur = [];
  drawWorld();
  switch (G.state) {
    case 'title': renderTitle(); break;
    case 'select': renderSelect(); break;
    case 'options': renderOptions(); break;
    case 'countdown': renderCountdown(); break;
    case 'playing': renderPlaying(); break;
    case 'paused': renderPlaying(); renderPaused(); break;
    case 'result': renderResult(); break;
    default: break;
  }
  ui.last = ui.cur;
}

 * ===================================================================== */
function resize() {
  const cs = getComputedStyle(document.body), px = (v) => parseFloat(v) || 0;
  const vw = window.innerWidth - px(cs.paddingLeft) - px(cs.paddingRight);
  const vh = window.innerHeight - px(cs.paddingTop) - px(cs.paddingBottom);
  const s = Math.max(0.1, Math.min(vw / W, vh / H)), dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  view.scale = canvas.width / W;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  update(dt);
  render();
}

/* PWA: 설치 버튼 · 서비스 워커 등록 */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__installPrompt = e; G.installReady = true; });
window.addEventListener('appinstalled', () => { window.__installPrompt = null; G.installReady = false; });
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) G.updateReady = true; hadController = true; });
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {}); });
}

/* 시작 */
loadPrefs();
newWorld();
resetFrogs();
resize();
Sprites.load();
requestAnimationFrame(frame);
window.__frog = { G, CONFIG, ASSETS, THEME_ASSETS, newWorld, generateWorld, validateWorld, judgeLanding, sharkHit, launch, setTheme, toggleOption, goOptions, startMatch };   // 디버깅용 훅 (콘솔에서 __frog.G 로 상태 확인)

/* =====================================================================
 * 확장 가이드
 *  - 개구리 종류/스탯 추가: CONFIG.frogs 에 { id, name, concept, desc, power, sigma, color, dark } 한 줄 추가
 *    → 선택 화면 카드·스프라이트 키(frog_<id>_<상태>)가 자동으로 생깁니다. (카드는 5장 기준 레이아웃)
 *  - 스프라이트 교체: assets/ 폴더에 ASSETS 매니페스트의 src 경로대로 PNG를 넣기만 하면 됩니다.
 *      예) assets/frogs/balanced/idle.png (64×64, 위쪽을 보는 모양), assets/stone.png, assets/water.png …
 *      여러 프레임은 가로로 이어 붙이고 ASSETS 의 frames/fps 를 맞춰 주세요.
 *  - 밸런스: CONFIG.jump(거리·차징·오차), CONFIG.stone(공비·크기·배치 범위) 수정
 *  - 새 버전 배포: sw.js 의 VERSION 값을 올리면 설치된 앱도 새 파일로 갱신됩니다.
 * ===================================================================== */
})();
